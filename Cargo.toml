[package]
name = "safe-migrate"
version = "0.1.0"
edition = "2024"
description = "Lint PostgreSQL migrations against live database statistics to prevent blocking locks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dsecurity49/safe-migrate"
readme = "README.md"
keywords = ["postgres", "migration", "linter", "ast", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
squawk-linter = { git = "https://github.com/sbdchd/squawk" }
squawk-syntax = { git = "https://github.com/sbdchd/squawk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
postgres = "0.19"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
