[package]
name = "safe-migrate"
version = "0.4.0"
edition = "2024"
description = "Lint PostgreSQL migrations against live database statistics to prevent blocking locks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dsecurity49/safe-migrate"
readme = "README.md"
keywords = ["postgres", "migration", "linter", "ast", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
squawk-syntax = "=2.58.0"
squawk-linter = "=2.58.0"
squawk-lexer  = "=2.58.0"
squawk-parser = "=2.58.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
postgres = "0.19"
rowan = "0.15.18"
owo-colors = "4"
terminal_size = "0.3"
comfy-table = "7"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
