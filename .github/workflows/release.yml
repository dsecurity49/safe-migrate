name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Linux (Ubuntu/Debian)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # ARM64 Linux (AWS Graviton, ARM CI runners)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Statically linked Linux (Alpine containers - CRITICAL for CI)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and package binary
        id: package
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: safe-migrate
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Verify packaged release assets
        shell: bash
        run: |
          archive="${{ steps.package.outputs.tar || steps.package.outputs.zip }}"
          checksum="${{ steps.package.outputs.sha256 }}"
          test -n "$archive"
          test -n "$checksum"
          test -f "$archive"
          test -f "$checksum"

      - name: Stage packaged release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tar || steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packaged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 14
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 7
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Refuse to alter a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | [.tag_name, .draft] | @tsv' |
              awk -v tag="$GITHUB_REF_NAME" '$1 == tag { print $2 }'
          )"
          case "$release_state" in
            "")
              ;;
            true)
              ;;
            *)
              echo "Refusing to alter an existing published release for ${GITHUB_REF_NAME}." >&2
              exit 1
              ;;
          esac

      - name: Upload assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft=false
          --latest
