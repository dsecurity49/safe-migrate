name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build (locked)
        run: cargo build --locked --verbose

      - name: Run tests (locked)
        run: cargo test --locked --verbose

      - name: Run Clippy (Linter)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install and run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  live-differential:
    name: PostgreSQL differential harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safe_migrate
          POSTGRES_USER: safe_migrate
          POSTGRES_PASSWORD: safe_migrate
        options: >-
          --health-cmd "pg_isready -U safe_migrate -d safe_migrate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://safe_migrate:safe_migrate@localhost:5432/safe_migrate
      SAFE_MIGRATE_DIFF_VERBOSITY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compare simulator state with PostgreSQL
        run: scripts/live-differential
