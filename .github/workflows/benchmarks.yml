name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Performance Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run allocation and throughput benchmarks
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo test --locked --lib performance_scenarios -- --ignored --nocapture --test-threads=1 2>&1 | tee artifacts/benchmarks.log

      - name: Summarize benchmark scenarios
        if: always()
        run: |
          if [ -f artifacts/benchmarks.log ]; then
            {
              echo '### Performance scenarios'
              echo
              echo "- commit: \`$GITHUB_SHA\`"
              echo "- host: \`$(uname -sm)\`"
              echo "- rust: \`$(rustc --version)\`"
              echo
              echo '```'
              grep '^scenario=' artifacts/benchmarks.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: artifacts/benchmarks.log
          if-no-files-found: error
